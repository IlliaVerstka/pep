<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
<title>Portable Education Platform</title>
<link rel="stylesheet" href="/css/style.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="format-detection" content="telephone=no">
</head>

<body>
    <div class="wrapper">
        <header class="header">
    <div class="header__logo-block">
        <div class="header__logo logo">
            <img src="/img/logo.svg" alt="">
            Portable<br>Education<br>Platform
        </div>
    </div>
    <div class="header__menu menu">
        <ul class="menu__list">
            <li><a href="/" class="menu__link ">Головна</a></li>
            <li><a href="/student.html" class="menu__link ">Здобувачу освіти</a></li>
            <li><a href="/schedule.html" class="menu__link ">Електронний розклад</a></li>
            <li><a href="/my-class.html" class="menu__link ">Мій клас</a></li>
            <li><a href="" class="menu__link ">Картка "Моя освіта"</a></li>
            <li><a href="" class="menu__link ">Тестування</a></li>
        </ul>
    </div>
    <a href="#" class="header__burger menu-burger">
        <p class="menu-burger__label">Меню</p>
        <span class="menu-burger__icon"><span></span></span>
    </a>
    <div class="header__actions" data-me="767.98, .menu, last">
        <a href="/register.html" class="header__btn btn btn_small btn_border btn_circle">Зареєструватися</a>
        <a href="/login.html" class="header__btn btn btn_small btn_blue btn_circle">Увійти</a>
    </div>
</header>
        <div class="page page_no-padding">
            <div class="page__account-form block-account-form">
                <div class="block-account-form__container -container">
                    <h2 class="block-account-form__title title"><i></i><span>Увійти</span><i></i></h2>
                    <div class="block-account-form__form-wrap block-account-form__form-wrap_login -white-shadow">
                        <form action="#" class="block-account-form__form account-form account-form_login" data-form>
                            <div class="account-form__section">
                                <p class="account-form__label">Електронна адреса</p>
                                <div class="account-form__input -input-form -input-big">
                                    <input data-value="Введіть щось" class="-req -email" autocomplete="off" type="text" name="email">
                                </div>
                            </div>
                            <div class="account-form__section">
                                <p class="account-form__label">Ваш пароль</p>
                                <div class="account-form__input -input-form -input-big">
                                    <input data-value="Введіть щось" class="-req -password" autocomplete="off" type="password" name="password">
                                </div>
                            </div>
                            <div class="account-form__action">
                                <button class="account-form__submit btn btn_big btn_blue" type="submit">Увійти</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothscroll/1.4.10/SmoothScroll.min.js"></script>
<script src="/js/libs.min.js"></script>
<script src="/js/script.js"></script>
</body>

</html>
